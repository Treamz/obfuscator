name: dart_obfuscator
description: Library used to obfuscate Dart and Flutter source code.
version: 0.1.0
repository: https://github.com/Treamz/obfuscator
homepage: https://github.com/Treamz/obfuscator
issue_tracker: https://github.com/Treamz/obfuscator/issues

environment:
  sdk: ^3.11.0

executables:
  obfuscator: obfuscator

dependencies:
  analyzer: ^14.4.0
  dart_style: ^3.1.13
  args: ^2.7.0
  path: ^1.9.1
  package_config: ^2.2.0
  pub_semver: ^2.1.4
  pubspec_parse: ^1.5.0
  yaml_edit: ^2.2.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6